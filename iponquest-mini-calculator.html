<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IponQuest Mini Calculator</title>
<style>
:root{--bg:#f7f8f5;--card:#fff;--text:#2c3424;--accent:#a8b5a2;--border:#daded8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.calculator{width:min(100%,340px);background:var(--card);border:1px solid var(--border);border-radius:24px;padding:18px}
.title{font-size:14px;font-weight:700;margin-bottom:10px}
.display{min-height:78px;display:flex;align-items:end;justify-content:flex-end;padding:14px 16px;margin-bottom:12px;border:1px solid var(--border);border-radius:16px;font-size:30px;font-weight:650;overflow-wrap:anywhere;background:#fbfcfa}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
button{min-height:52px;border:1px solid var(--border);border-radius:15px;background:var(--card);color:var(--text);font-size:17px;font-weight:650;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.operator{background:var(--accent)}
.clear{grid-column:1/-1;background:#eef1ec}
</style>
</head>
<body>
<main class="calculator" aria-label="IponQuest Mini Calculator">
<div class="title">🧮 IponQuest Quick Calculator</div>
<div id="display" class="display" aria-live="polite">0</div>
<div class="keys">
<button data-number="7">7</button><button data-number="8">8</button><button data-number="9">9</button><button class="operator" data-operator="/">÷</button>
<button data-number="4">4</button><button data-number="5">5</button><button data-number="6">6</button><button class="operator" data-operator="*">×</button>
<button data-number="1">1</button><button data-number="2">2</button><button data-number="3">3</button><button class="operator" data-operator="-">−</button>
<button data-number="0">0</button><button data-number=".">.</button><button class="operator" data-action="equals">=</button><button class="operator" data-operator="+">+</button>
<button class="clear" data-action="clear">C</button>
</div>
</main>
<script>
(()=>{const d=document.getElementById("display");let a="",b="",op=null,reset=false;
const show=v=>d.textContent=v||"0";
const calc=()=>{const x=Number(a),y=Number(b);if(!Number.isFinite(x)||!Number.isFinite(y))return null;let z;if(op==="+")z=x+y;else if(op==="-")z=x-y;else if(op==="*")z=x*y;else if(op==="/"){if(y===0)return null;z=x/y}return Number.isFinite(z)?String(z):null};
document.querySelectorAll("[data-number]").forEach(btn=>btn.addEventListener("click",()=>{const v=btn.dataset.number;if(reset){a="";b="";reset=false}if(!op){if(v==="."&&a.includes("."))return;if(v==="."&&!a)a="0";a+=v;show(a)}else{if(v==="."&&b.includes("."))return;if(v==="."&&!b)b="0";b+=v;show(b)}}));
document.querySelectorAll("[data-operator]").forEach(btn=>btn.addEventListener("click",()=>{if(!a)return;if(op&&b){const z=calc();if(z===null){show("Error");a="";b="";op=null;return}a=z;b=""}op=btn.dataset.operator;show(a)}));
document.querySelector('[data-action="equals"]').addEventListener("click",()=>{if(!op||!b)return;const z=calc();if(z===null)show("Error");else{a=z;show(z)}b="";op=null;reset=true});
document.querySelector('[data-action="clear"]').addEventListener("click",()=>{a="";b="";op=null;reset=false;show("0")});
})();
</script>
</body>
</html>
